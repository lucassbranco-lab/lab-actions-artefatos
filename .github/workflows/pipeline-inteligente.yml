name: Pipeline Inteligente com Artefatos

on:
  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'

  push:
    branches:
      - 'feature/**'
    paths:
      - 'src/**'
      - '!src/docs/**'

jobs:
  job_gerador:
    name: Gerador de Artefatos
    runs-on: ubuntu-latest

    steps:
      - name: Gerar arquivos de relatorio
        run: |
          mkdir -p saida_build
          echo "Relatorio 1 gerado com sucesso" > saida_build/relatorio1.txt
          echo "Relatorio 2 gerado com sucesso" > saida_build/relatorio2.txt

      - name: Upload dos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: saida_build/

  job_auditoria:
    name: Auditoria dos Artefatos
    runs-on: ubuntu-latest
    needs: job_gerador

    steps:
      - name: Download dos artefatos
        uses: actions/download-artifact@v4
        with:
          name: meus-relatorios-oficiais

      - name: Conferir arquivos baixados
        run: |
          ls -R
          cat relatorio1.txt
